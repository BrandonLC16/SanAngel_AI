name: Security checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install verified Gitleaks
        shell: bash
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb \
            "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan committed history without publishing findings
        run: python -m scripts.scan_secrets --scanner "$RUNNER_TEMP/gitleaks"

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install project and pinned audit tool
        run: |
          python -m pip install --upgrade pip==26.2.0
          python -m pip install -e ".[dev]" pip-audit==2.10.1
      - name: Test and audit Python dependencies
        run: |
          python -m pip check
          python -m pytest -q
          ruff check .
          ruff format --check .
          python -m pip_audit --local --progress-spinner off
          python -m pip_audit --require-hashes --progress-spinner off -r requirements-prod.lock

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.18.0"
      - name: Install locked frontend dependencies
        run: npm ci --prefix frontend --ignore-scripts --no-audit
      - name: Test, build, and audit frontend dependencies
        run: |
          npm --prefix frontend test
          npm --prefix frontend run build
          npm audit --prefix frontend

  containers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build both branch-independent images
        run: |
          docker build --build-arg SOURCE_DATE_EPOCH=0 --platform linux/amd64 -f Dockerfile -t sanangel-backend:ci .
          docker build --build-arg SOURCE_DATE_EPOCH=0 --platform linux/amd64 -f Dockerfile.frontend -t sanangel-panel:ci .
          test "$(docker image inspect sanangel-backend:ci --format '{{.Config.User}}')" = '10001:10001'
          test "$(docker image inspect sanangel-panel:ci --format '{{.Config.User}}')" = '10001:10001'
          test "$(docker image inspect sanangel-backend:ci --format '{{json .Config.Healthcheck}}')" != 'null'
          test "$(docker image inspect sanangel-panel:ci --format '{{json .Config.Healthcheck}}')" != 'null'

  publish_images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [containers, secrets]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and publish pilot images to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          backend_image="ghcr.io/${owner}/sanangel-backend"
          panel_image="ghcr.io/${owner}/sanangel-panel"
          tag="sha-${GITHUB_SHA}"
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          docker build --build-arg SOURCE_DATE_EPOCH=0 --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -f Dockerfile -t "${backend_image}:${tag}" .
          docker build --build-arg SOURCE_DATE_EPOCH=0 --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -f Dockerfile.frontend -t "${panel_image}:${tag}" .
          docker push "${backend_image}:${tag}"
          docker push "${panel_image}:${tag}"
          backend_ref="$(docker image inspect "${backend_image}:${tag}" --format '{{index .RepoDigests 0}}')"
          panel_ref="$(docker image inspect "${panel_image}:${tag}" --format '{{index .RepoDigests 0}}')"
          [[ "${backend_ref}" == "${backend_image}@sha256:"* ]]
          [[ "${panel_ref}" == "${panel_image}@sha256:"* ]]
          printf 'BACKEND_IMAGE=%s\nPANEL_IMAGE=%s\n' "${backend_ref}" "${panel_ref}" | tee -a "${GITHUB_STEP_SUMMARY}"
