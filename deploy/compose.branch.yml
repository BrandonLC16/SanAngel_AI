# Run this same template as a separate Compose project for each branch.
services:
  backend:
    image: ${BACKEND_IMAGE:?set a reviewed backend image tag}
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      APP_ENV: production
      APP_HOST: 127.0.0.1
      APP_PORT: "8000"
      TRUSTED_PROXY_IPS: 127.0.0.1
      CORS_ALLOWED_ORIGINS: ""
      ASSISTANT_BRANCH_CODE: ${ASSISTANT_BRANCH_CODE:?set the assigned branch code}
      GREEN_API_INSTANCE_ID: ${GREEN_API_INSTANCE_ID:?set the assigned instance}
      DATABASE_URL: ${DATABASE_URL:-sqlite+pysqlite:////data/assistant.db}
      SECRETS_DIR: /run/secrets
    volumes:
      - branch_data:/data
      - type: bind
        source: ${SECRETS_DIR_HOST:?set the external manager mount}
        target: /run/secrets
        read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    ports:
      - "${PUBLIC_HTTP_PORT:-80}:8080"
      - "${PUBLIC_HTTPS_PORT:-443}:8443"

  panel:
    image: ${PANEL_IMAGE:?set a reviewed panel image tag}
    network_mode: service:backend
    depends_on:
      backend:
        condition: service_healthy
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?set the branch domain}
      PANEL_DIST: /srv
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m

volumes:
  branch_data:
  caddy_data:
  caddy_config:
