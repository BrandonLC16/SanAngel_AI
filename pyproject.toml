[build-system]
requires = ["setuptools>=84.0,<85.0"]
build-backend = "setuptools.build_meta"

[project]
name = "carniceria-ai-chatbot"
version = "0.1.0"
description = "Backend para el chatbot de atencion al cliente de una cadena de carnicerias."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic>=1.20,<1.21",
    "argon2-cffi>=25.1,<26.0",
    "cryptography>=50.0.1,<51.0",
    "fastapi>=0.141,<0.142",
    "httpx>=0.28,<0.29",
    "openpyxl>=3.1.5,<3.2",
    "openai>=3.3,<3.4",
    "pydantic>=2.13,<2.14",
    "pydantic-settings>=2.15,<2.16",
    "sqlalchemy>=2.0.54,<2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10.0",
    "ruff>=0.16,<0.17",
    "uvicorn>=0.52,<0.53",
]

[tool.setuptools.packages.find]
include = ["backend", "backend.app*"]

[tool.setuptools.package-data]
"backend.app.prompts" = ["*.txt"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["docs/fase_1_diseno.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
