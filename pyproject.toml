[build-system]
requires = ["setuptools>=84.0,<85.0"]
build-backend = "setuptools.build_meta"

[project]
name = "carniceria-ai-chatbot"
version = "0.1.0"
description = "Backend para el chatbot de atencion al cliente de una cadena de carnicerias."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "pydantic>=2.13,<2.14",
    "pydantic-settings>=2.15,<2.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10.0",
    "ruff>=0.16,<0.17",
]

[tool.setuptools.packages.find]
include = ["backend", "backend.app*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["docs/fase_1_diseno.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
